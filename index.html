<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل تطبيق ارنبي</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#f4f7f6; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px; }
  .card { background:#fff; border-radius:20px; padding:40px 30px; max-width:400px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.08); }
  .icon { width:100px; height:100px; background:#e8f5e9; border-radius:24px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; font-size:48px; }
  h1 { font-size:24px; color:#1a1a1a; margin:0 0 10px; }
  p { font-size:15px; color:#666; line-height:1.6; margin:0 0 25px; }
  .btn { display:block; background:#2e7d32; color:#fff; text-decoration:none; padding:16px; border-radius:12px; font-size:18px; font-weight:bold; transition:0.2s; }
  .btn:hover { background:#1b5e20; }
  .note { font-size:12px; color:#999; margin-top:20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛴</div>
    <h1>تطبيق ارنبي</h1>
    <p>حمّل التطبيق الآن واستمتع بأسهل تجربة تنقل. اضغط على الزر بالأسفل لبدء التحميل مباشرة.</p>

    <!-- تم وضع رابط التحميل المباشر الخاص بك هنا -->
    <a href="https://drive.google.com/uc?export=download&id=1wJKgkBZqLZCAHpv9kxxQT51uFGIXnVWP" class="btn">تحميل التطبيق</a>

    <div class="note">متوافق مع أجهزة أندرويد</div>
  </div>
</body>
</html>
